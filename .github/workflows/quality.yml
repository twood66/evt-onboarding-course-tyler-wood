name: quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Test the report validator
        run: python -m unittest discover -s tests -v
      - name: Parse the macOS and Linux checker
        run: bash -n setup/check.sh
      - name: Parse the Windows checker
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw "setup/check.ps1")) | Out-Null'
      - name: Validate the learner setup report
        run: python scripts/validate_setup_report.py
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Compile the no-hardware Teensy project
        run: pio run --project-dir lessons/01-setup/smoke --environment teensy41
