name: Course help
description: Ask for help with a public onboarding-course problem.
title: "[Course help] "
labels:
  - course-help
body:
  - type: markdown
    attributes:
      value: |
        Do not post tokens, passwords, private repository contents, personal contact information, or unapproved vehicle data.
  - type: dropdown
    id: lesson
    attributes:
      label: Lesson
      options:
        - Lesson 1, workstation setup
        - Lesson 2, Git and GitHub
        - Lesson 3, Python
        - Lesson 4, C++ and PlatformIO
        - Lesson 5, integration
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Not operating-system specific
    validations:
      required: true
  - type: textarea
    id: failed-check
    attributes:
      label: Failed check or command
      description: Copy the check name or command. Remove personal and private information.
      placeholder: "[FAIL] PlatformIO Core runs"
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Exact error
      description: Paste the smallest useful error excerpt. Do not paste credentials or private data.
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What have you tried?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, passwords, personal information, private repository contents, and private vehicle data.
          required: true
